name: Public source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python 00_Tools/build_rgbds.py
      - run: python 00_Tools/change_surface.py report --check
      - run: python -m unittest discover -s tests -v
      - run: python 00_Tools/selftest.py
      - run: python 00_Tools/audit_pages.py --check
      - run: python 00_Tools/audit_loader_timing.py
      - run: python 00_Tools/audit_loader_payload.py
      - run: python 00_Tools/audit_public_tree.py
      # No original or localized ROM is fetched or uploaded by CI.
